name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - run: node dist/index.js . --output scan-report.json --fail-on-vuln

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-report
          path: scan-report.json
